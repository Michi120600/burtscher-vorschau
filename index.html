const b=Uint8Array.from(atob(D),c=>c.charCodeAt(0)),m=document.getElementById('m');
async function auf(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:I,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28)));
}
async function los(pw,leise){
  if(!leise)m.textContent='Einen Moment …';
  try{
    const h=await auf(pw);
    try{sessionStorage.setItem('vp',pw)}catch(e){}
    document.open();document.write(h);document.close();
  }catch(e){ if(!leise)m.textContent='Das Passwort stimmt nicht.'; }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();los(document.getElementById('p').value.trim())});
try{const s=sessionStorage.getItem('vp');if(s)los(s,true)}catch(e){}
